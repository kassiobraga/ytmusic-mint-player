<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ytmRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff1a47"/>
      <stop offset="75%" stop-color="#e6002e"/>
      <stop offset="100%" stop-color="#b30024"/>
    </radialGradient>
  </defs>
  <!-- Outer Vinyl Disc -->
  <circle cx="32" cy="32" r="30" fill="url(#ytmRed)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
  <!-- Vinyl Grooves (makes rotation clearly visible while spinning) -->
  <path d="M 32 6 A 26 26 0 0 1 58 32" fill="none" stroke="rgba(255,255,255,0.42)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M 32 58 A 26 26 0 0 1 6 32" fill="none" stroke="rgba(255,255,255,0.26)" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M 14 14 A 25 25 0 0 1 32 7" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Inner White Ring -->
  <circle cx="32" cy="32" r="16" fill="none" stroke="#ffffff" stroke-width="3"/>
  <!-- Play Triangle -->
  <polygon points="27.5,24 41.5,32 27.5,40" fill="#ffffff"/>
</svg>
